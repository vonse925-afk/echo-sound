<!DOCTYPE html>
<html lang="ru"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Echo Sound</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#030307;--glass-bg:rgba(255,255,255,.04);--glass-border:rgba(255,255,255,.1);--glass-highlight:rgba(255,255,255,.22);--ac:#a855f7;--ac-glow:rgba(168,85,247,.7);--tx:#fff;--mu:rgba(255,255,255,.5)}
*{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;overflow:hidden;height:100vh;position:relative}
.bg-blobs{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.blob{position:absolute;border-radius:50%;filter:blur(90px);opacity:.45;animation:float 16s infinite alternate ease-in-out}
.blob-1{width:320px;height:320px;background:#6366f1;top:-100px;left:-100px}
.blob-2{width:380px;height:380px;background:#a855f7;bottom:-50px;right:-100px;animation-delay:-5s}
.blob-3{width:260px;height:260px;background:#ec4899;top:35%;left:25%;animation-delay:-9s}
@keyframes float{0%{transform:translate(0,0) scale(1)}50%{transform:translate(45px,60px) scale(1.2)}100%{transform:translate(-30px,35px) scale(.85)}}
.glass-card{background:var(--glass-bg);backdrop-filter:blur(35px);-webkit-backdrop-filter:blur(35px);border:1px solid var(--glass-border);border-top:1px solid var(--glass-highlight);box-shadow:0 20px 45px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.12);border-radius:26px}
.app-container{position:relative;z-index:1;height:100vh}
.screen{display:none;padding:18px 18px 150px;overflow-y:auto;height:100%;animation:fadeIn .25s ease}
.screen.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.top-bar{display:flex;align-items:center;margin-bottom:20px}
.user-info{display:flex;align-items:center;gap:12px}
.ava{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#a855f7,#6366f1);display:flex;align-items:center;justify-content:center;font-weight:bold;border:1.5px solid var(--glass-highlight);box-shadow:0 0 15px var(--ac-glow)}
.greeting small{color:var(--mu);font-size:12px}.greeting h3{font-size:16px;font-weight:600}
.banner{padding:22px;margin-bottom:24px;cursor:pointer;transition:transform .2s;background:linear-gradient(135deg,rgba(139,92,246,.2),rgba(59,130,246,.08))}
.banner:active{transform:scale(.98)}
.banner h2{font-size:22px;margin-bottom:6px;text-shadow:0 2px 12px rgba(139,92,246,.6)}.banner p{color:var(--mu);font-size:13px}
.section-title{font-size:18px;font-weight:600;margin:18px 0 12px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.empty{grid-column:1/-1;color:var(--mu);text-align:center;padding:30px 0;font-size:14px}
.track-card{padding:12px;transition:transform .2s;cursor:pointer;position:relative}
.track-card:active{transform:scale(.96)}
.cover-box{width:100%;aspect-ratio:1;border-radius:18px;margin-bottom:10px;background-size:cover;background-position:center;background-color:#1a1530;border:1px solid var(--glass-border);box-shadow:0 10px 25px rgba(0,0,0,.4)}
.track-card h4{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.track-card p{font-size:12px;color:var(--mu);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.heart{position:absolute;top:18px;right:18px;width:34px;height:34px;border-radius:50%;border:0;background:rgba(0,0,0,.5);color:#fff;font-size:17px;backdrop-filter:blur(8px)}
.heart.on{color:#ec4899}
.mini-player{position:fixed;bottom:84px;left:14px;right:14px;height:64px;padding:0 16px;display:flex;align-items:center;justify-content:space-between;z-index:10;cursor:pointer;background:rgba(15,12,28,.75);border:1px solid rgba(139,92,246,.35);box-shadow:0 15px 35px rgba(0,0,0,.7),0 0 25px rgba(139,92,246,.2)}
.mini-info{display:flex;align-items:center;gap:12px;overflow:hidden}
.mini-cover{width:44px;height:44px;border-radius:12px;background-size:cover;background-position:center;border:1px solid var(--glass-border);flex-shrink:0}
.mini-text{overflow:hidden}.mini-text h4{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.mini-text p{font-size:12px;color:var(--mu)}
.play-btn{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#a855f7,#6366f1);border:none;color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 0 20px var(--ac-glow);cursor:pointer;flex-shrink:0}
.nav-bar{position:fixed;bottom:12px;left:14px;right:14px;height:62px;display:flex;justify-content:space-around;align-items:center;z-index:9;background:rgba(8,8,14,.9)}
.nav-btn{background:none;border:none;color:var(--mu);display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;cursor:pointer;transition:color .2s}
.nav-btn.active{color:#fff;text-shadow:0 0 12px var(--ac-glow)}
.nav-btn svg{width:22px;height:22px;fill:currentColor}
.full-player{position:fixed;inset:0;background:radial-gradient(circle at 50% 20%,#1f113a 0%,#030307 85%);z-index:100;transform:translateY(100%);transition:transform .4s cubic-bezier(.16,1,.3,1);padding:28px 24px;display:flex;flex-direction:column;justify-content:space-between}
.full-player.active{transform:none}
.full-header{display:flex;justify-content:space-between;align-items:center}
.header-title{font-size:12px;letter-spacing:2px;color:var(--mu);text-transform:uppercase;font-weight:600}
.full-cover-container{position:relative;width:85%;max-width:280px;aspect-ratio:1;margin:0 auto}
.full-cover-glow{position:absolute;inset:-15px;border-radius:40px;background:linear-gradient(135deg,#a855f7,#3b82f6,#ec4899);filter:blur(35px);opacity:.6;animation:glowPulse 5s infinite alternate ease-in-out}
@keyframes glowPulse{0%{transform:scale(.9);opacity:.4}100%{transform:scale(1.1);opacity:.75}}
.full-cover{width:100%;height:100%;border-radius:30px;background-size:cover;background-position:center;background-color:#1a1530;border:1px solid var(--glass-highlight);box-shadow:0 30px 60px rgba(0,0,0,.8);position:relative;z-index:2}
.track-details{text-align:center}
.track-details h2{font-size:22px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track-details p{color:var(--mu);font-size:14px;margin-top:4px}
.eq-bars{display:flex;gap:5px;justify-content:center;height:22px;align-items:flex-end;margin:8px 0}
.eq-bar{width:4px;background:#a855f7;border-radius:3px;animation:eqAnim .7s infinite alternate ease-in-out;box-shadow:0 0 10px var(--ac-glow)}
.eq-bar:nth-child(1){animation-delay:-.1s}.eq-bar:nth-child(2){animation-delay:-.3s}.eq-bar:nth-child(3){animation-delay:-.5s}.eq-bar:nth-child(4){animation-delay:-.2s}.eq-bar:nth-child(5){animation-delay:-.4s}
.eq-bars.paused .eq-bar{animation-play-state:paused}
@keyframes eqAnim{0%{height:6px}100%{height:22px}}
.player-controls-area{background:rgba(255,255,255,.03);border:1px solid var(--glass-border);border-radius:24px;padding:18px;backdrop-filter:blur(20px)}
.progress-container{width:100%;margin-bottom:15px}
.seek-slider{width:100%;-webkit-appearance:none;appearance:none;height:6px;border-radius:3px;outline:none;background:rgba(255,255,255,.15)}
.seek-slider::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 0 14px var(--ac),0 0 6px #fff;cursor:pointer}
.time-codes{display:flex;justify-content:space-between;font-size:12px;color:var(--mu);margin-top:6px}
.main-controls{display:flex;justify-content:space-around;align-items:center}
.ctrl-btn{background:none;border:none;color:#fff;cursor:pointer;font-size:26px;opacity:.85}
.ctrl-btn:active{transform:scale(.9);opacity:1}
.search-input{width:100%;padding:14px;color:#fff;outline:none;margin-bottom:15px;font-size:16px}

.plus{position:absolute;top:18px;left:18px;width:34px;height:34px;border-radius:50%;border:0;background:rgba(0,0,0,.5);color:#fff;font-size:18px;backdrop-filter:blur(8px)}
.btn{padding:11px 14px;border-radius:14px;border:1px solid var(--glass-border);background:linear-gradient(135deg,#a855f7,#6366f1);color:#fff;font-size:14px}
.btn.sec,.pl-btns .btn:nth-child(n+3){background:var(--glass-bg)}
.pl-btns{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.pl-top{display:flex;gap:14px;align-items:center}
.pl-cover{width:110px;height:110px;border-radius:20px;background-size:cover;background-position:center;border:1px solid var(--glass-border);flex-shrink:0}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;display:none;align-items:flex-end;justify-content:center;padding:14px}
.modal.on{display:flex}
.modal-box{width:100%;max-width:420px;padding:20px;background:rgba(20,16,36,.96)}
.modal-box h3{margin-bottom:12px}.modal-box .btn{width:100%;margin-top:8px}
#toast{position:fixed;top:20px;left:50%;transform:translate(-50%,-90px);background:#a855f7;padding:10px 18px;border-radius:14px;z-index:300;transition:transform .3s;font-size:14px}
#toast.on{transform:translate(-50%,0)}
#sh,#rp{opacity:.4}#sh.on,#rp.on{opacity:1;color:#c084fc;text-shadow:0 0 12px var(--ac-glow)}

.grid{grid-template-columns:repeat(2,minmax(0,1fr))}
.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.i.f{fill:currentColor}
.ctrl-btn{display:flex;align-items:center;justify-content:center}.ctrl-btn .i{width:28px;height:28px}
.play-btn .i{width:20px;height:20px;stroke-width:1}.bp{width:68px;height:68px}.bp .i{width:28px;height:28px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px}.btn .i{width:18px;height:18px}
.cover-box .i{width:40px;height:40px}
.list{display:flex;flex-direction:column;gap:2px}
.row{display:flex;align-items:center;gap:12px;padding:8px 6px;border-radius:16px;cursor:pointer;transition:background .15s}
.row:active{background:rgba(255,255,255,.07)}
.row .th{width:52px;height:52px;border-radius:12px;background-size:cover;background-position:center;background-color:#1a1530;flex-shrink:0;border:1px solid var(--glass-border)}
.row .tx{flex:1;min-width:0}
.row .tx b{display:block;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .tx span{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mu);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .ic{background:none;border:0;color:var(--mu);padding:8px;display:flex}
.row .ic.on{color:#ec4899}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;background:#6b7280;flex-shrink:0}
.dot.echo{background:#22d3ee}.dot.audius{background:#a855f7}.dot.itunes{background:#fa2d48}
.chips{display:flex;gap:8px;margin-bottom:14px}
.chip{padding:8px 16px;border-radius:14px;border:1px solid var(--glass-border);background:var(--glass-bg);color:var(--tx);font-size:14px}
.chip.on{background:rgba(168,85,247,.25);border-color:rgba(168,85,247,.7);box-shadow:0 0 14px rgba(168,85,247,.35)}
</style></head>
<body>
<div class="bg-blobs"><div class="blob blob-1"></div><div class="blob blob-2"></div><div class="blob blob-3"></div></div>

<div class="app-container">
  <div id="screen-home" class="screen active">
    <div class="top-bar"><div class="user-info"><div class="ava" id="user-ava">E</div>
      <div class="greeting"><small id="time-greeting">Добрый день</small><h3 id="user-name">Слушатель</h3></div></div></div>
    <div class="glass-card banner" onclick="playMixed()"><h2 style="display:flex;align-items:center;gap:8px"><svg class="i f" viewBox="0 0 24 24"><path d="M13 2L3 14h9l-1 8 10-12h-9z"/></svg> Твой микс</h2><p>Случайные треки из твоей медиатеки. Нажми, чтобы запустить</p></div>
    <div class="section-title">Новое в Echo Sound</div>
    <div class="list" id="chart-grid"></div>
  </div>

  <div id="screen-search" class="screen">
    <div class="section-title">Поиск музыки</div>
    <input type="text" id="search-input" placeholder="Название или исполнитель..." class="glass-card search-input" autocomplete="off" oninput="onSearchInput(this.value)">
    <div class="chips"><button class="chip on" onclick="setF('all',this)">Все</button><button class="chip" onclick="setF('echo',this)">Echo</button><button class="chip" onclick="setF('audius',this)">Audius</button><button class="chip" onclick="setF('itunes',this)">iTunes</button></div>
    <div class="list" id="search-grid"><div class="empty">Ищем по Audius (полные треки) и iTunes (превью 30 сек)</div></div>
  </div>

  <div id="screen-library" class="screen">
    <div class="section-title">Медиатека</div>
    <div class="section-title" style="font-size:15px;margin-top:4px">Плейлисты</div>
    <div class="grid" id="pl-grid"></div>
    <div class="section-title" style="font-size:15px">Любимые</div>
    <div class="list" id="library-grid"></div>
  </div>

  <div id="screen-pl" class="screen"><div id="pl-head"></div><div class="list" id="pl-tracks"></div></div>

  <div class="glass-card mini-player" id="mini-player" onclick="openFull()">
    <div class="mini-info"><div class="mini-cover" id="mini-cover"></div>
      <div class="mini-text"><h4 id="mini-title">Выберите трек</h4><p id="mini-artist">Echo Sound</p></div></div>
    <button class="play-btn" onclick="event.stopPropagation();togglePlay()"></button>
  </div>

  <div class="glass-card nav-bar">
    <button class="nav-btn active" onclick="switchTab('home',this)"><svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>Главная</button>
    <button class="nav-btn" onclick="switchTab('search',this)"><svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>Поиск</button>
    <button class="nav-btn" onclick="switchTab('library',this)"><svg viewBox="0 0 24 24"><path d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H8V4h12v12z"/></svg>Медиатека</button>
  </div>
</div>

<div class="full-player" id="full-player">
  <div class="full-header"><button class="ctrl-btn" onclick="closeFull()"><svg class="i" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button><span class="header-title">Сейчас играет</span><div style="width:20px"></div></div>
  <div class="full-cover-container"><div class="full-cover-glow"></div><div class="full-cover" id="full-cover"></div></div>
  <div class="track-details"><h2 id="full-title">Echo Sound</h2><p id="full-artist">Выберите трек</p>
    <div class="eq-bars paused" id="eq"><div class="eq-bar"></div><div class="eq-bar"></div><div class="eq-bar"></div><div class="eq-bar"></div><div class="eq-bar"></div></div></div>
  <div class="player-controls-area">
    <div class="progress-container"><input type="range" class="seek-slider" id="seek-slider" value="0" min="0" max="100" step="0.1" oninput="seekAudio(this.value)">
      <div class="time-codes"><span id="current-time">0:00</span><span id="total-duration">0:00</span></div></div>
    <div class="main-controls">
      <button class="ctrl-btn" id="sh" onclick="toggleShuffle()"></button>
      <button class="ctrl-btn" onclick="step(-1)"><svg class="i f" viewBox="0 0 24 24"><path d="M19 20L9 12l10-8zM5 4v16"/></svg></button>
      <button class="play-btn bp" onclick="togglePlay()"></button>
      <button class="ctrl-btn" onclick="step(1)"><svg class="i f" viewBox="0 0 24 24"><path d="M5 4l10 8-10 8zM19 4v16"/></svg></button>
      <button class="ctrl-btn" id="rp" onclick="toggleRepeat()"></button></div>
  </div>
</div>
<div class="modal" id="modal" onclick="if(event.target===this)closeModal()"><div class="modal-box glass-card" id="modal-box"></div></div>
<div id="toast"></div>
<input type="file" id="file" accept="image/*" hidden>
<audio id="audio-player"></audio>

<script>
const $=id=>document.getElementById(id);
const APP="EchoSound",FALLBACK="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=400";
const tg=window.Telegram?.WebApp;
if(tg){tg.ready();tg.expand();const u=tg.initDataUnsafe?.user;if(u){$('user-name').textContent=u.first_name;$('user-ava').textContent=u.first_name[0]}}
const hr=new Date().getHours();
$('time-greeting').textContent=hr<6?"Доброй ночи":hr<12?"Доброе утро":hr<18?"Добрый день":"Добрый вечер";
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const demo=[
 ["Ultra Indigo","Echo Sound","photo-1618005182384-a83a8bd57fbe"],["Neon Drive","Midnight City","photo-1508700115892-45ecd05ae2ad"],
 ["Velvet Sky","Luna Phase","photo-1518709268805-4e9042af9f23"],["Deep Blue","Sub Zero","photo-1550684848-fac1c5b4e853"]
].map((d,i)=>({id:"d"+i,title:d[0],artist:d[1],cover:"https://images.unsplash.com/"+d[2]+"?w=400",url:"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-"+(i+1)+".mp3",src:"demo"}));

const IC={
 heart:'<path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"/>',
 plus:'<path d="M12 5v14M5 12h14"/>',
 x:'<path d="M18 6L6 18M6 6l12 12"/>',
 shuffle:'<path d="M16 3h5v5M4 20L21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/>',
 repeat:'<path d="M17 1l4 4-4 4M3 11V9a4 4 0 0 1 4-4h14M7 23l-4-4 4-4M21 13v2a4 4 0 0 1-4 4H3"/>',
 repeat1:'<path d="M17 1l4 4-4 4M3 11V9a4 4 0 0 1 4-4h14M7 23l-4-4 4-4M21 13v2a4 4 0 0 1-4 4H3M11 10h1v4"/>',
 play:'<path d="M7 4l13 8-13 8z"/>',
 pause:'<path d="M6 4h4v16H6zM14 4h4v16h-4z"/>',
 left:'<path d="M15 18l-6-6 6-6"/>',
 image:'<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/>',
 edit:'<path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>',
 trash:'<path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6M10 11v6M14 11v6"/>'
};
const ic=(n,f)=>`<svg class="i${f?" f":""}" viewBox="0 0 24 24">${IC[n]}</svg>`;
let filt="all";
const API="";   // адрес Cloudflare Worker, например https://echo.xxx.workers.dev
let chartList=demo;
const bg=t=>t.cover?`url('${esc(t.cover)}')`:grad(t.title);
function fl(){return results.filter(t=>filt==="all"||t.src===filt)}
const ld=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}};
const sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){toast("Не хватило памяти")}};
let lib=ld("lib",[]),pls=ld("pls",[]),results=[],queue=[],qi=0,curPl=null,pend=null,shuffle=false,rep=0;
const audio=$('audio-player');
const listOf=n=>({chart:chartList,search:fl(),lib:lib,pl:curPl?curPl.tracks:[]}[n]);
const saved=t=>lib.some(x=>x.id===t.id);
function grad(s){let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))%360;return `linear-gradient(135deg,hsl(${h},70%,45%),hsl(${(h+60)%360},70%,25%))`}
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),2200)}

/* Карточки */
function row(t,n,i){
  const src=t.src==="echo"?"Echo Sound":t.src==="audius"?"Audius":t.src==="itunes"?"iTunes · превью 30с":"Демо";
  const act=n==='pl'
    ?`<button class="ic" onclick="event.stopPropagation();rmFromPl(${i})">${ic('x')}</button>`
    :`<button class="ic" onclick="event.stopPropagation();pickPl('${n}',${i})">${ic('plus')}</button><button class="ic ${saved(t)?'on':''}" onclick="event.stopPropagation();like('${n}',${i})">${ic('heart',saved(t))}</button>`;
  return `<div class="row" onclick="playFrom('${n}',${i})"><div class="th" style="background-image:${bg(t)}"></div><div class="tx"><b>${esc(t.title)}</b><span><i class="dot ${t.src}"></i>${src} · ${esc(t.artist)}</span></div>${act}</div>`;
}
function plCard(p){
  return `<div class="glass-card track-card" onclick="openPl('${p.id}')">
    <div class="cover-box" style="background-image:${p.cover?`url('${p.cover}')`:grad(p.name)}"></div>
    <h4>${esc(p.name)}</h4><p>${p.tracks.length} треков</p></div>`;
}
function renderAll(){
  $('chart-grid').innerHTML=chartList.map((t,i)=>row(t,'chart',i)).join('');
  $('pl-grid').innerHTML=`<div class="glass-card track-card" onclick="newPl()"><div class="cover-box" style="display:flex;align-items:center;justify-content:center;color:var(--mu)">${ic('plus')}</div><h4>Новый плейлист</h4><p>Создать</p></div>`+pls.map(plCard).join('');
  $('library-grid').innerHTML=lib.length?lib.map((t,i)=>row(t,'lib',i)).join(''):'<div class="empty">Пока пусто. Найди трек и нажми на сердце</div>';
  renderSearch();renderPl();
}
function renderSearch(){
  if(!results.length)return;
  const v=fl();
  $('search-grid').innerHTML=v.length?v.map((t,i)=>row(t,'search',i)).join(''):'<div class="empty">Нет результатов из этого источника</div>';
}
function setF(f,b){filt=f;document.querySelectorAll('.chip').forEach(c=>c.classList.remove('on'));b.classList.add('on');renderSearch()}
function like(n,i){
  const t=listOf(n)[i];
  lib=saved(t)?lib.filter(x=>x.id!==t.id):[...lib,t];
  sv("lib",lib);renderAll();tg?.HapticFeedback?.impactOccurred("light");
}

/* Плейлисты */
function modal(html){$('modal-box').innerHTML=html;$('modal').classList.add('on')}
function closeModal(){$('modal').classList.remove('on')}
function newPl(keep){
  if(!keep)pend=null;
  modal(`<h3>Новый плейлист</h3><input id="pln" class="glass-card search-input" placeholder="Название плейлиста" maxlength="40"><button class="btn" onclick="createPl()">Создать</button>`);
  setTimeout(()=>$('pln')?.focus(),80);
}
function createPl(){
  const name=$('pln').value.trim()||"Плейлист "+(pls.length+1);
  const p={id:"p"+Date.now(),name,cover:"",tracks:pend?[pend]:[]};pend=null;
  pls.push(p);sv("pls",pls);closeModal();renderAll();toast("Плейлист создан");
}
function pickPl(n,i){
  pend=listOf(n)[i];
  modal(`<h3>Добавить в плейлист</h3>`+pls.map(p=>`<button class="btn sec" onclick="addToPl('${p.id}')">${esc(p.name)} (${p.tracks.length})</button>`).join('')+`<button class="btn" onclick="newPl(true)">Новый плейлист</button>`);
}
function addToPl(id){
  const p=pls.find(x=>x.id===id);
  if(p&&!p.tracks.some(x=>x.id===pend.id))p.tracks.push(pend);
  pend=null;sv("pls",pls);closeModal();renderAll();toast("Добавлено в плейлист");
}
function rmFromPl(i){curPl.tracks.splice(i,1);sv("pls",pls);renderAll()}
function showScreen(n){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));$('screen-'+n).classList.add('active')}
function openPl(id){curPl=pls.find(p=>p.id===id);showScreen('pl');renderPl()}
function closePl(){curPl=null;showScreen('library')}
function renderPl(){
  const p=curPl;if(!p)return;
  $('pl-head').innerHTML=`<button class="ctrl-btn" style="margin-bottom:12px;gap:4px;font-size:16px;justify-content:flex-start" onclick="closePl()">${ic('left')} Назад</button>
  <div class="pl-top"><div class="pl-cover" style="background-image:${p.cover?`url('${p.cover}')`:grad(p.name)}"></div><div><h2>${esc(p.name)}</h2><p style="color:var(--mu);margin-top:4px">${p.tracks.length} треков</p></div></div>
  <div class="pl-btns"><button class="btn" onclick="playPl(false)">${ic('play',true)} Играть</button><button class="btn" onclick="playPl(true)">${ic('shuffle')}</button><button class="btn" onclick="pickCover()">${ic('image')} Обложка</button><button class="btn" onclick="renamePl()">${ic('edit')}</button><button class="btn" onclick="delPl()">${ic('trash')}</button></div>`;
  $('pl-tracks').innerHTML=p.tracks.length?p.tracks.map((t,i)=>row(t,'pl',i)).join(''):'<div class="empty">Пусто. Нажми плюс у трека, чтобы добавить</div>';
}
function playPl(sh){
  if(!curPl.tracks.length)return;
  shuffle=sh;modeUi();playFrom('pl',sh?Math.floor(Math.random()*curPl.tracks.length):0);
}
function renamePl(){
  modal(`<h3>Название</h3><input id="pln" class="glass-card search-input" value="${esc(curPl.name)}" maxlength="40"><button class="btn" onclick="curPl.name=$('pln').value.trim()||curPl.name;sv('pls',pls);closeModal();renderAll()">Сохранить</button>`);
}
function delPl(){
  modal(`<h3>Удалить «${esc(curPl.name)}»?</h3><button class="btn" onclick="pls=pls.filter(p=>p!==curPl);sv('pls',pls);closeModal();closePl();renderAll()">Удалить</button><button class="btn sec" onclick="closeModal()">Отмена</button>`);
}
function pickCover(){$('file').value="";$('file').click()}
$('file').onchange=e=>{
  const f=e.target.files[0];if(!f||!curPl)return;
  const r=new FileReader(),img=new Image();
  r.onload=()=>{img.onload=()=>{
    const c=document.createElement("canvas");c.width=c.height=400;
    const s=Math.min(img.width,img.height);
    c.getContext("2d").drawImage(img,(img.width-s)/2,(img.height-s)/2,s,s,0,0,400,400);
    curPl.cover=c.toDataURL("image/jpeg",.8);sv("pls",pls);renderAll();toast("Обложка установлена");
  };img.src=r.result};
  r.readAsDataURL(f);
};

/* Источники */
const audMap=x=>({id:"a"+x.id,title:x.title,artist:x.user?.name||"Audius",cover:x.artwork?.["480x480"]||FALLBACK,url:`https://api.audius.co/v1/tracks/${x.id}/stream?app_name=${APP}`,src:"audius"});
const itnMap=x=>({id:"i"+x.trackId,title:x.trackName,artist:x.artistName,cover:(x.artworkUrl100||"").replace("100x100","400x400")||FALLBACK,url:x.previewUrl,src:"itunes"});
async function searchAudius(q){const j=await(await fetch(`https://api.audius.co/v1/tracks/search?query=${encodeURIComponent(q)}&limit=15&app_name=${APP}`)).json();return(j.data||[]).map(audMap)}
async function searchItunes(q){const j=await(await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(q)}&media=music&entity=song&limit=15`)).json();return(j.results||[]).filter(x=>x.previewUrl).map(itnMap)}
const stMap=x=>({id:"e"+x.uid,title:x.title,artist:x.artist,cover:"",url:API+"/audio/"+x.uid,src:"echo"});
async function searchStore(q){
  if(!API||!tg?.initData)return[];
  const r=await fetch(API+"/api/search?q="+encodeURIComponent(q),{headers:{"X-Init-Data":tg.initData}});
  const j=await r.json();
  return(j.tracks||[]).map(stMap);
}
async function loadChart(){
  try{const l=await searchStore("");if(l.length){chartList=l;renderAll()}}catch(e){}
}
async function resolve(id){
  if(id[0]==="e"){const j=await(await fetch(API+"/api/track/"+id.slice(1))).json();return j.uid?stMap(j):null}
  if(id[0]==="a"){const j=await(await fetch(`https://api.audius.co/v1/tracks/${id.slice(1)}?app_name=${APP}`)).json();return j.data?audMap(j.data):null}
  const j=await(await fetch(`https://itunes.apple.com/lookup?id=${id.slice(1)}`)).json();const x=j.results?.[0];return x?itnMap(x):null;
}
let timer,ticket=0;
function onSearchInput(v){clearTimeout(timer);timer=setTimeout(()=>doSearch(v),450)}
async function doSearch(q){
  q=q.trim();const my=++ticket;
  if(!q){results=[];$('search-grid').innerHTML='<div class="empty">Ищем по Audius (полные треки) и iTunes (превью 30 сек)</div>';return}
  $('search-grid').innerHTML='<div class="empty">Ищу…</div>';
  const [e,a,i]=await Promise.allSettled([searchStore(q),searchAudius(q),searchItunes(q)]);
  if(my!==ticket)return;
  results=[...(e.value||[]),...(a.value||[]),...(i.value||[])];
  if(results.length)renderSearch();else $('search-grid').innerHTML='<div class="empty">Ничего не найдено</div>';
}
/* Добавление из бота: ?add=id1,id2 */
async function handleAdd(){
  const q=new URLSearchParams(location.search).get("add");if(!q)return;
  let n=0;
  for(const id of q.split(",")){try{const t=await resolve(id);if(t&&!saved(t)){lib.push(t);n++}}catch(e){}}
  sv("lib",lib);renderAll();
  toast(n?"Добавлено в медиатеку":"Уже в медиатеке");
  switchTab("library",document.querySelectorAll(".nav-btn")[2]);
  history.replaceState(null,"",location.pathname);
}

/* Плеер */
function playFrom(n,i){queue=listOf(n).slice();qi=i;load()}
function load(){const t=queue[qi];if(!t)return;audio.src=t.url;audio.play().catch(()=>{});ui(t)}
function ui(t){
  $('mini-cover').style.backgroundImage=$('full-cover').style.backgroundImage=bg(t);
  $('mini-title').textContent=$('full-title').textContent=t.title;
  $('mini-artist').textContent=$('full-artist').textContent=t.artist;
}
function btns(){const p=audio.paused;document.querySelectorAll('.play-btn').forEach(b=>b.innerHTML=ic(p?'play':'pause',true));$('eq').classList.toggle('paused',p)}
audio.onplay=btns;audio.onpause=btns;
audio.onended=()=>step(1,true);
function togglePlay(){if(!audio.src){playFrom('chart',0);return}audio.paused?audio.play():audio.pause()}
function step(d,auto){
  if(!queue.length)return;
  if(auto&&rep===2){audio.currentTime=0;audio.play();return}
  let n;
  if(shuffle&&queue.length>1){do{n=Math.floor(Math.random()*queue.length)}while(n===qi)}
  else{n=qi+d;if(n>=queue.length||n<0){if(auto&&rep===0){btns();return}n=(n+queue.length)%queue.length}}
  qi=n;load();
}
function toggleShuffle(){shuffle=!shuffle;modeUi();toast(shuffle?"Случайный порядок":"По порядку добавления")}
function toggleRepeat(){rep=(rep+1)%3;modeUi();toast(["Повтор выключен","Повтор всех треков","Повтор одного трека"][rep])}
function modeUi(){$('sh').innerHTML=ic('shuffle');$('sh').classList.toggle('on',shuffle);$('rp').innerHTML=ic(rep===2?'repeat1':'repeat');$('rp').classList.toggle('on',rep>0)}
function playMixed(){shuffle=true;modeUi();const n=lib.length?'lib':'chart';playFrom(n,Math.floor(Math.random()*listOf(n).length));openFull()}
function openFull(){$('full-player').classList.add('active')}
function closeFull(){$('full-player').classList.remove('active')}
function switchTab(t,b){
  curPl=null;
  document.querySelectorAll('.screen,.nav-btn').forEach(x=>x.classList.remove('active'));
  $('screen-'+t).classList.add('active');b.classList.add('active');
}
audio.ontimeupdate=()=>{
  if(!audio.duration)return;
  const p=audio.currentTime/audio.duration*100,s=$('seek-slider');
  s.value=p;s.style.background=`linear-gradient(to right,#a855f7 ${p}%,rgba(255,255,255,.15) ${p}%)`;
  $('current-time').textContent=fmt(audio.currentTime);$('total-duration').textContent=fmt(audio.duration);
};
function seekAudio(v){if(audio.duration)audio.currentTime=v/100*audio.duration}
function fmt(s){const m=Math.floor(s/60),r=Math.floor(s%60);return m+":"+(r<10?"0":"")+r}
renderAll();modeUi();btns();handleAdd();loadChart();
</script></body></html>
