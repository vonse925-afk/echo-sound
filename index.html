<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Echo Sound</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #030307;
      --glass-bg: rgba(255, 255, 255, 0.04);
      --glass-border: rgba(255, 255, 255, 0.1);
      --glass-highlight: rgba(255, 255, 255, 0.22);
      --ac: #a855f7;
      --ac-glow: rgba(168, 85, 247, 0.7);
      --tx: #ffffff;
      --mu: rgba(255, 255, 255, 0.5);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
    body { background: var(--bg); color: var(--tx); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; overflow: hidden; height: 100vh; position: relative; }

    /* Плавающий фоновый анимированный градиент */
    .bg-blobs { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; overflow: hidden; pointer-events: none; }
    .blob { position: absolute; border-radius: 50%; filter: blur(90px); opacity: 0.45; animation: float 16s infinite alternate ease-in-out; }
    .blob-1 { width: 320px; height: 320px; background: #6366f1; top: -100px; left: -100px; }
    .blob-2 { width: 380px; height: 380px; background: #a855f7; bottom: -50px; right: -100px; animation-delay: -5s; }
    .blob-3 { width: 260px; height: 260px; background: #ec4899; top: 35%; left: 25%; animation-delay: -9s; }

    @keyframes float {
      0% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(45px, 60px) scale(1.2); }
      100% { transform: translate(-30px, 35px) scale(0.85); }
    }

    /* Эффект жидкого стекла */
    .glass-card {
      background: var(--glass-bg);
      backdrop-filter: blur(35px);
      -webkit-backdrop-filter: blur(35px);
      border: 1px solid var(--glass-border);
      border-top: 1px solid var(--glass-highlight);
      box-shadow: 0 20px 45px 0 rgba(0, 0, 0, 0.5), inset 0 1px 0 0 rgba(255, 255, 255, 0.12);
      border-radius: 26px;
    }

    .app-container { position: relative; z-index: 1; height: 100vh; display: flex; flex-direction: column; justify-content: space-between; }
    
    /* Большой отступ снизу, чтобы мини-плеер не перекрывал последние карточки */
    .screen { display: none; padding: 18px 18px 140px 18px; overflow-y: auto; height: 100%; animation: fadeIn 0.25s ease; }
    .screen.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

    /* Шапка */
    .top-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
    .user-info { display: flex; align-items: center; gap: 12px; }
    .ava { width: 44px; height: 44px; border-radius: 50%; background: linear-gradient(135deg, #a855f7, #6366f1); display: flex; align-items: center; justify-content: center; font-weight: bold; border: 1.5px solid var(--glass-highlight); box-shadow: 0 0 15px var(--ac-glow); }
    .greeting small { color: var(--mu); font-size: 12px; }
    .greeting h3 { font-size: 16px; font-weight: 600; }

    /* Баннер */
    .banner { padding: 22px; margin-bottom: 24px; position: relative; overflow: hidden; cursor: pointer; transition: transform 0.2s; background: linear-gradient(135deg, rgba(139, 92, 246, 0.2), rgba(59, 130, 246, 0.08)); }
    .banner:active { transform: scale(0.98); }
    .banner h2 { font-size: 22px; margin-bottom: 6px; text-shadow: 0 2px 12px rgba(139, 92, 246, 0.6); }
    .banner p { color: var(--mu); font-size: 13px; }

    .section-title { font-size: 18px; font-weight: 600; margin: 18px 0 12px 0; letter-spacing: 0.3px; }
    
    /* Карточки */
    .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
    .track-card { padding: 12px; transition: transform 0.2s; cursor: pointer; }
    .track-card:active { transform: scale(0.96); }
    .cover-box { width: 100%; aspect-ratio: 1; border-radius: 18px; margin-bottom: 10px; background-size: cover; background-position: center; border: 1px solid var(--glass-border); box-shadow: 0 10px 25px rgba(0,0,0,0.4); }
    .track-card h4 { font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 500; }
    .track-card p { font-size: 12px; color: var(--mu); margin-top: 2px; }

    /* Мини-плеер */
    .mini-player { position: fixed; bottom: 84px; left: 14px; right: 14px; height: 64px; padding: 0 16px; display: flex; align-items: center; justify-content: space-between; z-index: 10; cursor: pointer; backdrop-filter: blur(35px); background: rgba(15, 12, 28, 0.75); border: 1px solid rgba(139, 92, 246, 0.35); box-shadow: 0 15px 35px rgba(0,0,0,0.7), 0 0 25px rgba(139, 92, 246, 0.2); }
    .mini-info { display: flex; align-items: center; gap: 12px; overflow: hidden; }
    .mini-cover { width: 44px; height: 44px; border-radius: 12px; background-size: cover; border: 1px solid var(--glass-border); flex-shrink: 0; }
    .mini-text h4 { font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .mini-text p { font-size: 12px; color: var(--mu); }
    .play-btn { width: 40px; height: 40px; border-radius: 50%; background: linear-gradient(135deg, #a855f7, #6366f1); border: none; color: white; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 20px var(--ac-glow); cursor: pointer; }

    /* Нижняя навигация */
    .nav-bar { position: fixed; bottom: 12px; left: 14px; right: 14px; height: 62px; display: flex; justify-content: space-around; align-items: center; z-index: 9; background: rgba(8, 8, 14, 0.9); backdrop-filter: blur(30px); }
    .nav-btn { background: none; border: none; color: var(--mu); display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; cursor: pointer; transition: color 0.2s; }
    .nav-btn.active { color: #fff; text-shadow: 0 0 12px var(--ac-glow); }
    .nav-btn svg { width: 22px; height: 22px; fill: currentColor; }

    /* Полноэкранный плеер */
    .full-player { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle at 50% 20%, #1f113a 0%, #030307 85%); z-index: 100; transform: translateY(100%); transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1); padding: 28px 24px; display: flex; flex-direction: column; justify-content: space-between; }
    .full-player.active { transform: translateY(0); }
    
    .full-header { display: flex; justify-content: space-between; align-items: center; }
    .header-title { font-size: 12px; letter-spacing: 2px; color: var(--mu); text-transform: uppercase; font-weight: 600; }
    
    .full-cover-container { position: relative; width: 85%; max-width: 280px; aspect-ratio: 1; margin: 0 auto; }
    .full-cover-glow { position: absolute; inset: -15px; border-radius: 40px; background: linear-gradient(135deg, #a855f7, #3b82f6, #ec4899); filter: blur(35px); opacity: 0.6; animation: glowPulse 5s infinite alternate ease-in-out; }
    @keyframes glowPulse { 0% { transform: scale(0.9); opacity: 0.4; } 100% { transform: scale(1.1); opacity: 0.75; } }
    
    .full-cover { width: 100%; height: 100%; border-radius: 30px; background-size: cover; background-position: center; border: 1px solid var(--glass-highlight); box-shadow: 0 30px 60px rgba(0,0,0,0.8); position: relative; z-index: 2; }

    .track-details { text-align: center; }
    .track-details h2 { font-size: 22px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .track-details p { color: var(--mu); font-size: 14px; margin-top: 4px; }

    /* Эквалайзер */
    .eq-bars { display: flex; gap: 5px; justify-content: center; height: 22px; align-items: flex-end; margin: 8px 0; }
    .eq-bar { width: 4px; background: #a855f7; border-radius: 3px; animation: eqAnim 0.7s infinite alternate ease-in-out; box-shadow: 0 0 10px var(--ac-glow); }
    .eq-bar:nth-child(1) { animation-delay: -0.1s; height: 8px; }
    .eq-bar:nth-child(2) { animation-delay: -0.3s; height: 20px; }
    .eq-bar:nth-child(3) { animation-delay: -0.5s; height: 13px; }
    .eq-bar:nth-child(4) { animation-delay: -0.2s; height: 22px; }
    .eq-bar:nth-child(5) { animation-delay: -0.4s; height: 10px; }
    @keyframes eqAnim { 0% { height: 6px; } 100% { height: 22px; } }

    /* Премиальный слайдер с неоновым следом (трейлом) */
    .player-controls-area { background: rgba(255, 255, 255, 0.03); border: 1px solid var(--glass-border); border-radius: 24px; padding: 18px; backdrop-filter: blur(20px); }
    .progress-container { width: 100%; margin-bottom: 15px; }
    
    .seek-slider {
      width: 100%;
      -webkit-appearance: none;
      appearance: none;
      height: 6px;
      border-radius: 3px;
      outline: none;
      background: rgba(255, 255, 255, 0.15);
      /* Динамический трейл будет управляться через JS градиентом */
    }
    
    /* Кастомный светящийся бегунок */
    .seek-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #ffffff;
      box-shadow: 0 0 14px var(--ac), 0 0 6px #ffffff, inset 0 0 4px var(--ac);
      cursor: pointer;
      transition: transform 0.1s;
    }
    .seek-slider::-webkit-slider-thumb:active {
      transform: scale(1.35);
    }

    .time-codes { display: flex; justify-content: space-between; font-size: 12px; color: var(--mu); margin-top: 6px; }

    .main-controls { display: flex; justify-content: space-around; align-items: center; }
    .ctrl-btn { background: none; border: none; color: white; cursor: pointer; font-size: 26px; opacity: 0.85; transition: transform 0.15s, opacity 0.15s; }
    .ctrl-btn:active { transform: scale(0.9); opacity: 1; }
  </style>
</head>
<body>

  <div class="bg-blobs">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
  </div>

  <div class="app-container">
    <!-- ГЛАВНАЯ -->
    <div id="screen-home" class="screen active">
      <div class="top-bar">
        <div class="user-info">
          <div class="ava" id="user-ava">E</div>
          <div class="greeting">
            <small id="time-greeting">Добрый день</small>
            <h3 id="user-name">Слушатель</h3>
          </div>
        </div>
      </div>

      <div class="glass-card banner" onclick="playMixedTracks()">
        <h2>⚡ Твой микс</h2>
        <p>Подобрено в стиле Ultra Indigo. Нажми, чтобы запустить</p>
      </div>

      <div class="section-title">Чарт треков</div>
      <div class="grid" id="chart-grid"></div>
    </div>

    <!-- ПОИСК -->
    <div id="screen-search" class="screen">
      <div class="section-title">Поиск музыки</div>
      <input type="text" id="search-input" placeholder="Введите название трека..." class="glass-card" style="width:100%; padding:14px; color:#fff; outline:none; margin-bottom:15px; border:1px solid var(--glass-border);" oninput="filterTracks(this.value)">
      <div class="grid" id="search-grid"></div>
    </div>

    <!-- МЕДИАТЕКА -->
    <div id="screen-library" class="screen">
      <div class="section-title">📁 Медиатека</div>
      <p style="color:var(--mu); font-size:13px; margin-bottom:15px;">Ваши сохраненные и любимые треки</p>
      <div class="grid" id="library-grid"></div>
    </div>

    <!-- МИНИ-ПЛЕЕР -->
    <div class="glass-card mini-player" id="mini-player" onclick="openFullPlayer()">
      <div class="mini-info">
        <div class="mini-cover" id="mini-cover" style="background-image:url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=400')"></div>
        <div class="mini-text">
          <h4 id="mini-title">Выберите трек</h4>
          <p id="mini-artist">Echo Sound</p>
        </div>
      </div>
      <button class="play-btn" onclick="event.stopPropagation(); togglePlay();">▶</button>
    </div>

    <!-- НИЖНЯЯ ПАНЕЛЬ -->
    <div class="glass-card nav-bar">
      <button class="nav-btn active" onclick="switchTab('home', this)">
        <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
        Главная
      </button>
      <button class="nav-btn" onclick="switchTab('search', this)">
        <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
        Поиск
      </button>
      <button class="nav-btn" onclick="switchTab('library', this)">
        <svg viewBox="0 0 24 24"><path d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0-2-.9-2-2V4c0-1.1-.9-2-2-2zm0 14H8V4h12v12z"/></svg>
        Медиатека
      </button>
    </div>
  </div>

  <!-- ПОЛНОЭКРАННЫЙ ПЛЕЕР -->
  <div class="full-player" id="full-player">
    <div class="full-header">
      <button class="ctrl-btn" style="font-size: 20px;" onclick="closeFullPlayer()">✕</button>
      <span class="header-title">Сейчас играет</span>
      <div style="width:20px;"></div>
    </div>

    <div class="full-cover-container">
      <div class="full-cover-glow"></div>
      <div class="full-cover" id="full-cover" style="background-image:url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=400')"></div>
    </div>

    <div class="track-details">
      <h2 id="full-title">Ultra Indigo</h2>
      <p id="full-artist">Echo Sound</p>
      
      <div class="eq-bars">
        <div class="eq-bar"></div><div class="eq-bar"></div><div class="eq-bar"></div><div class="eq-bar"></div><div class="eq-bar"></div>
      </div>
    </div>

    <div class="player-controls-area">
      <div class="progress-container">
        <input type="range" class="seek-slider" id="seek-slider" value="0" min="0" max="100" step="0.1" oninput="seekAudio(this.value)">
        <div class="time-codes">
          <span id="current-time">0:00</span>
          <span id="total-duration">0:00</span>
        </div>
      </div>

      <div class="main-controls">
        <button class="ctrl-btn" onclick="prevTrack()">⏮</button>
        <button class="play-btn" style="width:68px; height:68px; font-size:26px;" onclick="togglePlay()">▶</button>
        <button class="ctrl-btn" onclick="nextTrack()">⏭</button>
      </div>
    </div>
  </div>

  <audio id="audio-player"></audio>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
      if (tg.initDataUnsafe?.user) {
        document.getElementById('user-name').textContent = tg.initDataUnsafe.user.first_name;
        document.getElementById('user-ava').textContent = tg.initDataUnsafe.user.first_name[0];
      }
    }

    const tracks = [
      { id: 1, title: "Ultra Indigo", artist: "Echo Sound", cover: "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=400", url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" },
      { id: 2, title: "Neon Drive", artist: "Midnight City", cover: "https://images.unsplash.com/photo-1508700115892-45ecd05ae2ad?w=400", url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3" },
      { id: 3, title: "Velvet Sky", artist: "Luna Phase", cover: "https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=400", url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3" },
      { id: 4, title: "Deep Blue", artist: "Sub Zero", cover: "https://images.unsplash.com/photo-1550684848-fac1c5b4e853?w=400", url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-4.mp3" }
    ];

    let currentTrackIdx = 0;
    const audio = document.getElementById('audio-player');

    function renderGrids() {
      const chartGrid = document.getElementById('chart-grid');
      const searchGrid = document.getElementById('search-grid');
      const libraryGrid = document.getElementById('library-grid');

      const html = tracks.map((t, idx) => `
        <div class="glass-card track-card" onclick="playTrack(${idx})">
          <div class="cover-box" style="background-image:url('${t.cover}')"></div>
          <h4>${t.title}</h4>
          <p>${t.artist}</p>
        </div>
      `).join('');

      chartGrid.innerHTML = html;
      searchGrid.innerHTML = html;
      libraryGrid.innerHTML = html;
    }

    function playTrack(idx) {
      currentTrackIdx = idx;
      const t = tracks[idx];
      audio.src = t.url;
      audio.play();

      updatePlayerUI(t);
    }

    function updatePlayerUI(t) {
      document.getElementById('mini-cover').style.backgroundImage = `url('${t.cover}')`;
      document.getElementById('mini-title').textContent = t.title;
      document.getElementById('mini-artist').textContent = t.artist;
      document.querySelectorAll('.play-btn').forEach(btn => btn.textContent = '❚❚');

      document.getElementById('full-cover').style.backgroundImage = `url('${t.cover}')`;
      document.getElementById('full-title').textContent = t.title;
      document.getElementById('full-artist').textContent = t.artist;
    }

    function togglePlay() {
      if (!audio.src) { playTrack(0); return; }
      if (audio.paused) {
        audio.play();
        document.querySelectorAll('.play-btn').forEach(btn => btn.textContent = '❚❚');
      } else {
        audio.pause();
        document.querySelectorAll('.play-btn').forEach(btn => btn.textContent = '▶');
      }
    }

    function playMixedTracks() {
      const randomIdx = Math.floor(Math.random() * tracks.length);
      playTrack(randomIdx);
      openFullPlayer();
    }

    function openFullPlayer() { document.getElementById('full-player').classList.add('active'); }
    function closeFullPlayer() { document.getElementById('full-player').classList.remove('active'); }
    function prevTrack() { playTrack((currentTrackIdx - 1 + tracks.length) % tracks.length); }
    function nextTrack() { playTrack((currentTrackIdx + 1) % tracks.length); }

    function switchTab(tab, btn) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      document.getElementById(`screen-${tab}`).classList.add('active');
      btn.classList.add('active');
    }

    function filterTracks(query) {
      const filtered = tracks.filter(t => t.title.toLowerCase().includes(query.toLowerCase()) || t.artist.toLowerCase().includes(query.toLowerCase()));
      document.getElementById('search-grid').innerHTML = filtered.map((t, idx) => `
        <div class="glass-card track-card" onclick="playTrack(${tracks.indexOf(t)})">
          <div class="cover-box" style="background-image:url('${t.cover}')"></div>
          <h4>${t.title}</h4>
          <p>${t.artist}</p>
        </div>
      `).join('');
    }

    // Обновление таймлайна, времени и неонового трейла за бегунком
    audio.ontimeupdate = () => {
      if (audio.duration) {
        const slider = document.getElementById('seek-slider');
        const percent = (audio.currentTime / audio.duration) * 100;
        
        slider.value = percent;
        // Создаем эффект заполненного следа (трейла) слева от ползунка
        slider.style.background = `linear-gradient(to right, #a855f7 ${percent}%, rgba(255, 255, 255, 0.15) ${percent}%)`;
        
        document.getElementById('current-time').textContent = formatTime(audio.currentTime);
        document.getElementById('total-duration').textContent = formatTime(audio.duration);
      }
    };

    function seekAudio(val) {
      if (audio.duration) {
        audio.currentTime = (val / 100) * audio.duration;
      }
    }

    function formatTime(sec) {
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return `${m}:${s < 10 ? '0' : ''}${s}`;
    }

    renderGrids();
  </script>
</body>
</html>
