<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Echo Sound</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #07070d;
      --glass-bg: rgba(255, 255, 255, 0.07);
      --glass-border: rgba(255, 255, 255, 0.18);
      --glass-highlight: rgba(255, 255, 255, 0.3);
      --ac: #7952ff;
      --ac-glow: rgba(121, 82, 255, 0.4);
      --tx: #ffffff;
      --mu: rgba(255, 255, 255, 0.6);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
    body { background: var(--bg); color: var(--tx); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; overflow: hidden; height: 100vh; position: relative; }

    /* Плавающий анимированный фон */
    .bg-blobs { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; overflow: hidden; pointer-events: none; }
    .blob { position: absolute; border-radius: 50%; filter: blur(70px); opacity: 0.6; animation: float 18s infinite alternate ease-in-out; }
    .blob-1 { width: 280px; height: 280px; background: #6366f1; top: -50px; left: -50px; }
    .blob-2 { width: 320px; height: 320px; background: #a855f7; bottom: 10%; right: -60px; animation-delay: -5s; }
    .blob-3 { width: 220px; height: 220px; background: #3b82f6; top: 45%; left: 20%; animation-delay: -10s; }

    @keyframes float {
      0% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(40px, 60px) scale(1.15); }
      100% { transform: translate(-30px, 30px) scale(0.9); }
    }

    /* Эффект жидкого стекла */
    .glass-card {
      background: var(--glass-bg);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 1px solid var(--glass-border);
      border-top: 1px solid var(--glass-highlight);
      box-shadow: 0 12px 32px 0 rgba(0, 0, 0, 0.37);
      border-radius: 24px;
    }

    .app-container { position: relative; z-index: 1; height: 100vh; display: flex; flex-direction: column; justify-content: space-between; padding-bottom: 80px; }
    .screen { display: none; padding: 18px; overflow-y: auto; height: 100%; animation: fadeIn 0.3s ease; }
    .screen.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

    /* Шапка */
    .top-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
    .user-info { display: flex; align-items: center; gap: 12px; }
    .ava { width: 44px; height: 44px; border-radius: 50%; background: linear-gradient(135deg, #a855f7, #6366f1); display: flex; align-items: center; justify-content: center; font-weight: bold; border: 1.5px solid var(--glass-highlight); }
    .greeting small { color: var(--mu); font-size: 12px; }
    .greeting h3 { font-size: 16px; font-weight: 600; }

    /* Баннеры и Сетка */
    .banner { padding: 22px; margin-bottom: 24px; position: relative; overflow: hidden; }
    .banner h2 { font-size: 22px; margin-bottom: 6px; }
    .banner p { color: var(--mu); font-size: 13px; }
    .section-title { font-size: 18px; font-weight: 600; margin: 18px 0 12px 0; }
    
    .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
    .track-card { padding: 12px; transition: transform 0.2s; cursor: pointer; }
    .track-card:active { transform: scale(0.96); }
    .cover-box { width: 100%; aspect-ratio: 1; border-radius: 16px; margin-bottom: 10px; background-size: cover; background-position: center; border: 1px solid var(--glass-border); }
    .track-card h4 { font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .track-card p { font-size: 12px; color: var(--mu); }

    /* Мини-плеер */
    .mini-player { position: fixed; bottom: 85px; left: 14px; right: 14px; height: 64px; padding: 0 16px; display: flex; align-items: center; justify-content: space-between; z-index: 10; cursor: pointer; }
    .mini-info { display: flex; align-items: center; gap: 12px; overflow: hidden; }
    .mini-cover { width: 44px; height: 44px; border-radius: 12px; background-size: cover; border: 1px solid var(--glass-border); flex-shrink: 0; }
    .mini-text h4 { font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .mini-text p { font-size: 12px; color: var(--mu); }
    .play-btn { width: 40px; height: 40px; border-radius: 50%; background: var(--ac); border: none; color: white; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 15px var(--ac-glow); }

    /* Навигация */
    .nav-bar { position: fixed; bottom: 12px; left: 14px; right: 14px; height: 62px; display: flex; justify-content: space-around; align-items: center; z-index: 9; }
    .nav-btn { background: none; border: none; color: var(--mu); display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; cursor: pointer; }
    .nav-btn.active { color: #fff; }
    .nav-btn svg { width: 22px; height: 22px; fill: currentColor; }

    /* Полноэкранный плеер */
    .full-player { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(7, 7, 13, 0.95); backdrop-filter: blur(35px); -webkit-backdrop-filter: blur(35px); z-index: 100; transform: translateY(100%); transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1); padding: 24px; display: flex; flex-direction: column; justify-content: space-between; }
    .full-player.active { transform: translateY(0); }
    .full-header { display: flex; justify-content: space-between; align-items: center; }
    .full-cover { width: 85%; aspect-ratio: 1; margin: 20px auto; border-radius: 28px; background-size: cover; border: 1px solid var(--glass-border); box-shadow: 0 20px 50px rgba(0,0,0,0.6); }
    .seek-slider { width: 100%; accent-color: var(--ac); margin: 15px 0; }
    .controls { display: flex; justify-content: space-around; align-items: center; margin-top: 10px; }
    .ctrl-btn { background: none; border: none; color: white; cursor: pointer; }

    /* Пульсирующий эквалайзер */
    .eq-bars { display: flex; gap: 4px; justify-content: center; height: 20px; align-items: flex-end; margin-top: 10px; }
    .eq-bar { width: 4px; background: var(--ac); border-radius: 2px; animation: eq 0.8s infinite alternate ease-in-out; }
    .eq-bar:nth-child(2) { animation-delay: -0.2s; }
    .eq-bar:nth-child(3) { animation-delay: -0.4s; }
    .eq-bar:nth-child(4) { animation-delay: -0.6s; }
    @keyframes eq { 0% { height: 4px; } 100% { height: 20px; } }
  </style>
</head>
<body>

  <div class="bg-blobs">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
  </div>

  <div class="app-container">
    <div id="screen-home" class="screen active">
      <div class="top-bar">
        <div class="user-info">
          <div class="ava" id="user-ava">E</div>
          <div class="greeting">
            <small id="time-greeting">Добрый день</small>
            <h3 id="user-name">Слушатель</h3>
          </div>
        </div>
      </div>

      <div class="glass-card banner">
        <h2>Твой микс</h2>
        <p>Персональная подборка в стиле Ultra Indigo</p>
      </div>

      <div class="section-title">Чарт</div>
      <div class="grid" id="chart-grid"></div>
    </div>

    <div id="screen-search" class="screen">
      <div class="section-title">Поиск</div>
      <input type="text" id="search-input" placeholder="Поиск треков..." class="glass-card" style="width:100%; padding:14px; color:#fff; outline:none; margin-bottom:15px;">
      <div class="grid" id="search-grid"></div>
    </div>

    <div class="glass-card mini-player" id="mini-player" onclick="openFullPlayer()">
      <div class="mini-info">
        <div class="mini-cover" id="mini-cover"></div>
        <div class="mini-text">
          <h4 id="mini-title">Выберите трек</h4>
          <p id="mini-artist">Echo Sound</p>
        </div>
      </div>
      <button class="play-btn" onclick="event.stopPropagation(); togglePlay();">▶</button>
    </div>

    <div class="glass-card nav-bar">
      <button class="nav-btn active" onclick="switchTab('home', this)">
        <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
        Главная
      </button>
      <button class="nav-btn" onclick="switchTab('search', this)">
        <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
        Поиск
      </button>
    </div>
  </div>

  <!-- Полноэкранный плеер -->
  <div class="full-player" id="full-player">
    <div class="full-header">
      <button class="ctrl-btn" onclick="closeFullPlayer()">✕</button>
      <span>Сейчас играет</span>
      <div style="width:24px;"></div>
    </div>

    <div class="full-cover" id="full-cover"></div>

    <div style="text-align:center;">
      <h2 id="full-title">Название трека</h2>
      <p id="full-artist" style="color:var(--mu); margin-top:4px;">Исполнитель</p>
      
      <div class="eq-bars">
        <div class="eq-bar"></div><div class="eq-bar"></div><div class="eq-bar"></div><div class="eq-bar"></div>
      </div>
    </div>

    <div>
      <input type="range" class="seek-slider" id="seek-slider" value="0" oninput="seekTrack(this.value)">
      <div class="controls">
        <button class="ctrl-btn" style="font-size:24px;" onclick="prevTrack()">⏮</button>
        <button class="play-btn" style="width:60px; height:60px; font-size:22px;" onclick="togglePlay()">▶</button>
        <button class="ctrl-btn" style="font-size:24px;" onclick="nextTrack()">⏭</button>
      </div>
    </div>
  </div>

  <audio id="audio-player"></audio>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
      if (tg.initDataUnsafe?.user) {
        document.getElementById('user-name').textContent = tg.initDataUnsafe.user.first_name;
        document.getElementById('user-ava').textContent = tg.initDataUnsafe.user.first_name[0];
      }
    }

    const tracks = [
      { id: 1, title: "Ultra Indigo", artist: "Echo Sound", cover: "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=400", url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" },
      { id: 2, title: "Neon Drive", artist: "Midnight City", cover: "https://images.unsplash.com/photo-1508700115892-45ecd05ae2ad?w=400", url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3" },
      { id: 3, title: "Velvet Sky", artist: "Luna Phase", cover: "https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=400", url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3" },
      { id: 4, title: "Deep Blue", artist: "Sub Zero", cover: "https://images.unsplash.com/photo-1550684848-fac1c5b4e853?w=400", url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-4.mp3" }
    ];

    let currentTrackIdx = 0;
    const audio = document.getElementById('audio-player');

    function renderTracks() {
      const grid = document.getElementById('chart-grid');
      grid.innerHTML = tracks.map((t, idx) => `
        <div class="glass-card track-card" onclick="playTrack(${idx})">
          <div class="cover-box" style="background-image:url('${t.cover}')"></div>
          <h4>${t.title}</h4>
          <p>${t.artist}</p>
        </div>
      `).join('');
    }

    function playTrack(idx) {
      currentTrackIdx = idx;
      const t = tracks[idx];
      audio.src = t.url;
      audio.play();

      document.getElementById('mini-cover').style.backgroundImage = `url('${t.cover}')`;
      document.getElementById('mini-title').textContent = t.title;
      document.getElementById('mini-artist').textContent = t.artist;
      document.querySelectorAll('.play-btn').forEach(btn => btn.textContent = '❚❚');

      document.getElementById('full-cover').style.backgroundImage = `url('${t.cover}')`;
      document.getElementById('full-title').textContent = t.title;
      document.getElementById('full-artist').textContent = t.artist;
    }

    function togglePlay() {
      if (!audio.src) { playTrack(0); return; }
      if (audio.paused) {
        audio.play();
        document.querySelectorAll('.play-btn').forEach(btn => btn.textContent = '❚❚');
      } else {
        audio.pause();
        document.querySelectorAll('.play-btn').forEach(btn => btn.textContent = '▶');
      }
    }

    function openFullPlayer() { document.getElementById('full-player').classList.add('active'); }
    function closeFullPlayer() { document.getElementById('full-player').classList.remove('active'); }
    function prevTrack() { playTrack((currentTrackIdx - 1 + tracks.length) % tracks.length); }
    function nextTrack() { playTrack((currentTrackIdx + 1) % tracks.length); }

    function switchTab(tab, btn) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      document.getElementById(`screen-${tab}`).classList.add('active');
      btn.classList.add('active');
    }

    renderTracks();
  </script>
</body>
</html>
